<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payload: L.I.Z.A</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; background-color: #050505;
            overflow: hidden; font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        
        /* Стили терминала */
        #terminal {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 16px; text-shadow: 0 0 5px #0f0; z-index: 10;
        }
        .cursor { display: inline-block; width: 10px; height: 16px; background: #0f0; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Стили финального послания */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2s ease-in; z-index: 1; }
        canvas { display: block; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; text-align: center; z-index: 20; opacity: 0;
            transition: opacity 3s ease-in 1s; pointer-events: none;
        }
        #message h1 {
            font-size: 2.5em; margin-bottom: 10px; text-shadow: 0 0 20px #8b0000, 0 0 40px #8b0000; letter-spacing: 3px;
        }
        #message p { font-size: 1.2em; color: #ccc; font-style: italic; }
    </style>
</head>
<body>

    <div id="terminal"></div>
    
    <div id="canvas-container">
        <canvas id="heartCanvas"></canvas>
    </div>

    <div id="message">
        <h1>Для Лизы</h1>
        <p>Мой самый удачный взлом.</p>
        <p style="font-size: 0.9em; color: #666; margin-top: 20px;">С первой годовщиной.</p>
    </div>

    <script>
        // --- 1. АНИМАЦИЯ ТЕРМИНАЛА ---
        const terminal = document.getElementById('terminal');
        const commands = [
            "root@y9cat:~$ ./decrypt_feelings.sh --target Liza",
            "[+] Initializing payload...",
            "[+] Bypassing firewalls...",
            "[+] Extracting memories: 365 days of data parsed.",
            "[!] WARNING: Overwhelming emotional overflow detected.",
            "[+] Decryption complete.",
            "root@y9cat:~$ execute anniversary.exe"
        ];
        
        let cmdIndex = 0;
        let charIndex = 0;

        function typeCommand() {
            if (cmdIndex < commands.length) {
                if (charIndex < commands[cmdIndex].length) {
                    terminal.innerHTML = commands.slice(0, cmdIndex).join('<br>') + (cmdIndex > 0 ? '<br>' : '') + commands[cmdIndex].substring(0, charIndex + 1) + '<span class="cursor"></span>';
                    charIndex++;
                    setTimeout(typeCommand, Math.random() * 50 + 20); // скорость печати
                } else {
                    charIndex = 0;
                    cmdIndex++;
                    setTimeout(typeCommand, 600); // пауза между строками
                }
            } else {
                setTimeout(startHeartPhase, 1000);
            }
        }

        setTimeout(typeCommand, 1000);

        // --- 2. АНИМАЦИЯ СЕРДЦА (CANVAS) ---
        function startHeartPhase() {
            terminal.style.transition = "opacity 1s";
            terminal.style.opacity = "0";
            
            setTimeout(() => {
                document.getElementById('canvas-container').style.opacity = "1";
                document.getElementById('message').style.opacity = "1";
                initCanvas();
            }, 1000);
        }

        function initCanvas() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            const particles = [];
            
            // Формула сердца
            function getHeartPoint(t) {
                const scale = Math.min(width, height) / 40; // адаптивный размер
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                return { x: width/2 + x * scale, y: height/2 + y * scale - 20 };
            }

            // Создаем частицы по контуру сердца
            for (let i = 0; i < Math.PI * 2; i += 0.02) {
                const point = getHeartPoint(i);
                particles.push({
                    x: point.x, y: point.y,
                    ox: point.x, oy: point.y, // оригинальные координаты
                    vx: 0, vy: 0,
                    size: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? '#8b0000' : '#ff3333'
                });
            }

            let mouseX = 0, mouseY = 0;
            window.addEventListener('pointermove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animate() {
                ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // эффект следа
                ctx.fillRect(0, 0, width, height);

                particles.forEach(p => {
                    // Реакция на курсор/палец
                    let dx = mouseX - p.x;
                    let dy = mouseY - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 100) {
                        p.vx -= (dx / dist) * 1.5;
                        p.vy -= (dy / dist) * 1.5;
                    }

                    // Возврат на исходную позицию
                    p.vx += (p.ox - p.x) * 0.05;
                    p.vy += (p.oy - p.y) * 0.05;
                    
                    // Трение
                    p.vx *= 0.85;
                    p.vy *= 0.85;

                    p.x += p.vx;
                    p.y += p.vy;

                    // Отрисовка с небольшим свечением
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
