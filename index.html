<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payload: M.I.S.H.K.A</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; background-color: #050505;
            overflow: hidden; font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        
        #terminal {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 16px; text-shadow: 0 0 5px #0f0; z-index: 10;
        }
        .cursor { display: inline-block; width: 10px; height: 16px; background: #0f0; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2s ease-in; z-index: 1; }
        canvas { display: block; }
        
        #message {
            position: absolute; top: 75%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; 
            text-align: center; z-index: 20; opacity: 0;
            transition: opacity 3s ease-in 1s; pointer-events: none;
        }
        
        /* Переливающийся текст */
        #message h1 {
            font-size: 2.2em; 
            margin-bottom: 5px; 
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff3333, #ffffff, #8b0000, #ff3333);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite linear;
            filter: drop-shadow(0 0 8px rgba(255, 51, 51, 0.4));
        }
        
        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: -200% 50%; }
        }

        #message p { font-size: 1.1em; color: #ccc; font-style: italic; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="terminal"></div>
    
    <div id="canvas-container">
        <canvas id="heartCanvas"></canvas>
    </div>

    <div id="message">
        <h1>Для моей Мышки</h1>
        <p>Мой самый удачный взлом.</p>
        <p style="font-size: 0.9em; color: #666; margin-top: 15px;">С первой годовщиной.</p>
    </div>

    <script>
        // --- ТЕРМИНАЛ ---
        const terminal = document.getElementById('terminal');
        const commands = [
            "root@y9cat:~$ ./decrypt_feelings.sh --target Mishka",
            "[+] Initializing payload...",
            "[+] Bypassing firewalls...",
            "[+] Extracting memories: 365 days of data parsed.",
            "[!] WARNING: Overwhelming emotional overflow detected.",
            "[+] Decryption complete.",
            "root@y9cat:~$ execute anniversary.exe"
        ];
        
        let cmdIndex = 0;
        let charIndex = 0;

        function typeCommand() {
            if (cmdIndex < commands.length) {
                if (charIndex < commands[cmdIndex].length) {
                    terminal.innerHTML = commands.slice(0, cmdIndex).join('<br>') + (cmdIndex > 0 ? '<br>' : '') + commands[cmdIndex].substring(0, charIndex + 1) + '<span class="cursor"></span>';
                    charIndex++;
                    setTimeout(typeCommand, Math.random() * 50 + 20);
                } else {
                    charIndex = 0;
                    cmdIndex++;
                    setTimeout(typeCommand, 600);
                }
            } else {
                setTimeout(startHeartPhase, 1000);
            }
        }

        setTimeout(typeCommand, 1000);

        function startHeartPhase() {
            terminal.style.transition = "opacity 1s";
            terminal.style.opacity = "0";
            
            setTimeout(() => {
                document.getElementById('canvas-container').style.opacity = "1";
                document.getElementById('message').style.opacity = "1";
                initCanvas();
            }, 1000);
        }

        // --- КАНВАС (СЕРДЦЕ + САЛЮТЫ) ---
        function initCanvas() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            const particles = [];
            const fireworks = []; // Массив для салютов
            
            function getHeartPoint(t) {
                const scale = Math.min(width, height) / 45; 
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                return { x: width/2 + x * scale, y: height/2 + y * scale - 80 };
            }

            for (let i = 0; i < Math.PI * 2; i += 0.02) {
                const point = getHeartPoint(i);
                particles.push({
                    x: point.x, y: point.y,
                    ox: point.x, oy: point.y,
                    vx: 0, vy: 0,
                    size: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? '#8b0000' : '#ff3333'
                });
            }

            let mouseX = 0, mouseY = 0;
            window.addEventListener('pointermove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animate() {
                ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
                ctx.fillRect(0, 0, width, height);

                // 1. Отрисовка салютов на фоне
                if (Math.random() < 0.04) { // 4% шанс появления салюта каждый кадр
                    const startX = Math.random() * width;
                    const startY = Math.random() * (height * 0.7);
                    const colors = ['255, 51, 51', '255, 255, 255', '139, 0, 0'];
                    const fwColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    for (let i = 0; i < 15; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 2.5 + 0.5;
                        fireworks.push({
                            x: startX, y: startY,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            alpha: 1,
                            color: fwColor
                        });
                    }
                }

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    let f = fireworks[i];
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.02; // Гравитация салюта
                    f.alpha -= 0.015; // Затухание

                    if (f.alpha <= 0) {
                        fireworks.splice(i, 1);
                    } else {
                        ctx.beginPath();
                        ctx.arc(f.x, f.y, 1.2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${f.color}, ${f.alpha})`;
                        ctx.fill();
                    }
                }

                // 2. Отрисовка сердца (поверх салютов)
                particles.forEach(p => {
                    let dx = mouseX - p.x;
                    let dy = mouseY - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 100) {
                        p.vx -= (dx / dist) * 1.5;
                        p.vy -= (dy / dist) * 1.5;
                    }

                    p.vx += (p.ox - p.x) * 0.05;
                    p.vy += (p.oy - p.y) * 0.05;
                    p.vx *= 0.85;
                    p.vy *= 0.85;
                    p.x += p.vx;
                    p.y += p.vy;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
